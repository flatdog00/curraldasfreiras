<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curral das Freiras</title>
<meta name="description" content="Curral das Freiras, Madeira — uma porta para o mundo.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400&display=swap" rel="stylesheet">
<style>
:root{--ink:#f2efe8;--bg:#0b0d0c;--muted:rgba(242,239,232,.55)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;font-weight:300;overflow-x:hidden}

/* ---------- HERO 3D (scroll) ---------- */
.stage{position:relative;height:260vh}
.sticky{position:sticky;top:0;height:100svh;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity 2s ease}
#c.ready{opacity:1}
.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding-top:16vh;text-align:center;pointer-events:none}
.title h1{font-weight:100;font-size:clamp(2.6rem,9vw,7.5rem);letter-spacing:-.02em;line-height:.95;
  animation:rise 1.8s .2s cubic-bezier(.2,.7,.2,1) both}
.title p{margin-top:18px;font-weight:200;font-size:clamp(.85rem,1.4vw,1.05rem);letter-spacing:.24em;opacity:.8;
  animation:rise 1.8s .6s cubic-bezier(.2,.7,.2,1) both}
.meta{position:absolute;left:32px;right:32px;bottom:26px;display:flex;justify-content:space-between;
  font-size:.62rem;letter-spacing:.36em;text-transform:uppercase;color:var(--muted);pointer-events:none}
.alt{position:absolute;right:32px;top:50%;transform:translateY(-50%);text-align:right;
  font-size:.62rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);pointer-events:none}
.alt b{display:block;font-weight:100;font-size:2.2rem;letter-spacing:0;color:var(--ink);text-transform:none}
.hint{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);width:1px;height:42px;
  background:linear-gradient(var(--ink),transparent);opacity:.5;animation:drip 2.4s ease-in-out infinite}
@keyframes drip{0%{transform:translateX(-50%) scaleY(0);transform-origin:top}50%{transform:translateX(-50%) scaleY(1);transform-origin:top}
  51%{transform-origin:bottom}100%{transform:translateX(-50%) scaleY(0);transform-origin:bottom}}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* ---------- MOSAICO (pequeno) ---------- */
.gal{max-width:760px;margin:0 auto;padding:clamp(64px,10vw,120px) 16px 40px}
.gal h2{font-weight:200;font-size:clamp(1.3rem,2.6vw,1.9rem);text-align:center;margin-bottom:8px}
.gal small{display:block;text-align:center;font-size:.62rem;letter-spacing:.36em;text-transform:uppercase;color:var(--muted);margin-bottom:40px}
.mosaic{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tile{position:relative;aspect-ratio:1;overflow:hidden;background:#141816;cursor:pointer;
  opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.tile.in{opacity:1;transform:none}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.tile .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:100;font-size:2rem;opacity:.25}
.tile figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 14px 12px;font-weight:200;font-size:.95rem;
  background:linear-gradient(transparent,rgba(0,0,0,.6));transform:translateY(100%);transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.mosaic:hover .tile.in:not(:hover){opacity:.45}
.tile:hover img{transform:scale(1.07)}.tile:hover figcaption{transform:none}
@media (max-width:640px){.mosaic{grid-template-columns:repeat(2,1fr)}.tile figcaption{transform:none}
  .meta{left:16px;right:16px}.alt{right:16px}}

.lb{position:fixed;inset:0;z-index:20;background:rgba(6,8,7,.95);display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .4s}
.lb.open{opacity:1;pointer-events:auto}
.lb img{max-width:90vw;max-height:82vh;object-fit:contain}
.lb p{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-weight:200}
.lb button{position:absolute;background:none;border:0;color:var(--ink);font:100 2rem "Outfit";opacity:.6;padding:16px;cursor:pointer}
.lb button:hover{opacity:1}.lb .x{top:10px;right:14px}.lb .prev{left:6px}.lb .next{right:6px}

footer{padding:24px 16px 34px;text-align:center;font-size:.58rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);line-height:2}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<section class="stage" id="stage">
  <div class="sticky">
    <canvas id="c"></canvas>
    <div class="title">
      <h1>Curral das Freiras</h1>
      <p>uma porta para o mundo</p>
    </div>
    <div class="alt"><span>Altitude</span><b id="alt">—</b></div>
    <div class="hint"></div>
    <div class="meta"><span>Em breve</span><span>32°43′N · 16°58′W</span></div>
  </div>
</section>

<section class="gal">
  <h2>Um vale escondido no coração da Madeira</h2>
  <small>Descobre</small>
  <div class="mosaic" id="mosaic"></div>
</section>

<footer>Curral das Freiras · Madeira · Portugal<br>Relevo: dados de elevação abertos (Terrain Tiles · AWS Open Data)</footer>

<div class="lb" id="lb"><button class="x" aria-label="Fechar">✕</button><button class="prev" aria-label="Anterior">‹</button>
  <img alt=""><button class="next" aria-label="Seguinte">›</button><p></p></div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';

/* ===== ÁREA DO VALE (lat/lon) ===== */
const AREA = {n:32.745, s:32.695, w:-16.995, e:-16.940};
const Z = 13;                         // nível de detalhe dos dados
const EXAG = 1.15;                    // exagero vertical (1 = real)
const TILE = z=>`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/`;

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x0b0d0c, 9, 22);
const camera = new THREE.PerspectiveCamera(38, 1, .05, 100);

function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);
  camera.aspect=w/h;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();

/* --- coordenadas -> pixels globais do mapa (Web Mercator) --- */
const px = (lon,z)=>(lon+180)/360*256*2**z;
const py = (lat,z)=>{const r=lat*Math.PI/180;return (1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*256*2**z};

function loadImg(url){return new Promise((ok,ko)=>{const i=new Image();i.crossOrigin='anonymous';
  i.onload=()=>ok(i);i.onerror=ko;i.src=url})}

async function heightmap(){
  const x0=px(AREA.w,Z),x1=px(AREA.e,Z),y0=py(AREA.n,Z),y1=py(AREA.s,Z);
  const tx0=Math.floor(x0/256),tx1=Math.floor(x1/256),ty0=Math.floor(y0/256),ty1=Math.floor(y1/256);
  const cw=(tx1-tx0+1)*256,ch=(ty1-ty0+1)*256;
  const cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
  const ctx=cv.getContext('2d',{willReadFrequently:true});
  const jobs=[];
  for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++)
    jobs.push(loadImg(`${TILE(Z)}${tx}/${ty}.png`).then(im=>ctx.drawImage(im,(tx-tx0)*256,(ty-ty0)*256)));
  await Promise.all(jobs);
  const d=ctx.getImageData(0,0,cw,ch).data;
  const H=(x,y)=>{x=Math.max(0,Math.min(cw-1,x));y=Math.max(0,Math.min(ch-1,y));
    const i=(y*cw+x)*4;return d[i]*256+d[i+1]+d[i+2]/256-32768};
  // amostragem bilinear dentro da área pedida
  const ox=x0-tx0*256, oy=y0-ty0*256, w=x1-x0, h=y1-y0;
  const sample=(u,v)=>{const X=ox+u*w,Y=oy+v*h,xi=Math.floor(X),yi=Math.floor(Y),fx=X-xi,fy=Y-yi;
    return H(xi,yi)*(1-fx)*(1-fy)+H(xi+1,yi)*fx*(1-fy)+H(xi,yi+1)*(1-fx)*fy+H(xi+1,yi+1)*fx*fy};
  // metros por pixel nesta latitude
  const mpp=156543.03392*Math.cos(((AREA.n+AREA.s)/2)*Math.PI/180)/2**Z;
  return {sample, widthM:w*mpp, heightM:h*mpp};
}

const uniforms = Object.assign(THREE.UniformsUtils.clone(THREE.UniformsLib.fog),{uStep:{value:40}});
const material = new THREE.ShaderMaterial({
  uniforms, transparent:true, fog:true,
  vertexShader:`varying float vH;varying vec3 vN;varying vec3 vW;
    #include <fog_pars_vertex>
    void main(){vH=position.y;vN=normal;vec4 mvPosition=modelViewMatrix*vec4(position,1.);vW=position;
      gl_Position=projectionMatrix*mvPosition;
      #include <fog_vertex>
    }`,
  fragmentShader:`uniform float uStep;varying float vH;varying vec3 vN;varying vec3 vW;
    #include <fog_pars_fragment>
    void main(){
      float hM=vH;                                      // vH já está em metros/escala (ver JS)
      float f=hM/uStep; float lw=fwidth(f);
      float line=1.-smoothstep(0.,lw*1.2,abs(fract(f-.5)-.5));
      float f5=hM/(uStep*5.); float lw5=fwidth(f5);
      float major=1.-smoothstep(0.,lw5*1.5,abs(fract(f5-.5)-.5));
      float shade=clamp(dot(normalize(vN),normalize(vec3(-.4,.9,.35))),0.,1.);
      vec3 base=vec3(.055,.065,.06)+shade*.05;
      vec3 ink=vec3(.95,.93,.88);
      vec3 col=base+ink*(line*.22+major*.45);
      gl_FragColor=vec4(col,1.);
      #include <fog_fragment>
    }`
});

let terrain, meta={};
async function build(){
  const {sample,widthM,heightM}=await heightmap();
  const SEG=280, SIZE=10;                               // malha e tamanho da cena
  const sx=SIZE, sz=SIZE*heightM/widthM;
  const g=new THREE.PlaneGeometry(sx,sz,SEG,Math.round(SEG*heightM/widthM));
  g.rotateX(-Math.PI/2);
  const pos=g.attributes.position;
  const unit=SIZE/widthM;                               // unidades de cena por metro
  let mn=1e9,mx=-1e9;
  const hs=new Float32Array(pos.count);
  for(let i=0;i<pos.count;i++){
    const u=pos.getX(i)/sx+.5, v=pos.getZ(i)/sz+.5;
    const hm=Math.max(0,sample(u,v)); hs[i]=hm; mn=Math.min(mn,hm); mx=Math.max(mx,hm);
  }
  for(let i=0;i<pos.count;i++) pos.setY(i,(hs[i]-mn)*unit*EXAG);
  g.computeVertexNormals();
  // as curvas de nível usam a altura em "metros de cena": passo de 40 m
  uniforms.uStep.value=40*unit*EXAG;
  terrain=new THREE.Mesh(g,material);scene.add(terrain);
  meta={mn,mx,unit,sx,sz,sample};
  canvas.classList.add('ready');
}

/* --- câmara: Boca dos Namorados (sudoeste, alto) → vale --- */
const target=new THREE.Vector3(0,0.35,0);
const A={pos:new THREE.Vector3(-3.6,4.2,5.6)};     // vista alta, desde o rebordo
const B={pos:new THREE.Vector3(-1.2,1.55,2.1)};    // mais baixo, dentro do vale
let prog=0,sp=0,mx=0,my=0,smx=0,smy=0;
const stage=document.getElementById('stage');
addEventListener('scroll',()=>{const r=stage.getBoundingClientRect();
  prog=Math.min(1,Math.max(0,-r.top/(r.height-innerHeight)))},{passive:true});
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const altEl=document.getElementById('alt');
const titleEl=document.querySelector('.title');

function loop(t){
  sp+=(prog-sp)*.06; smx+=(mx-smx)*.05; smy+=(my-smy)*.05;
  const k=ease(sp);
  titleEl.style.opacity=Math.max(0,1-sp*1.8);titleEl.style.transform=`translateY(${-sp*60}px)`;
  camera.position.lerpVectors(A.pos,B.pos,k);
  camera.position.x+=smx*.6; camera.position.y+=-smy*.35;
  if(terrain){ // nunca deixar a câmara entrar na montanha
    const u=camera.position.x/meta.sx+.5, v=camera.position.z/meta.sz+.5;
    if(u>0&&u<1&&v>0&&v<1){const g=(Math.max(0,meta.sample(u,v))-meta.mn)*meta.unit*EXAG+.35;
      if(camera.position.y<g)camera.position.y=g;}
  }
  const look=target.clone(); look.y+=k*-.15;
  camera.lookAt(look);
  if(terrain){
    terrain.rotation.y=Math.sin(t*.00008)*.03;
    const altM=Math.round(meta.mn+(camera.position.y/meta.unit/EXAG));
    altEl.textContent=altM.toLocaleString('pt-PT')+' m';
  }
  renderer.render(scene,camera);
  requestAnimationFrame(loop);
}
build().catch(()=>{document.getElementById('alt').parentElement.style.display='none'});
requestAnimationFrame(loop);

/* ===== MOSAICO ===== */
const FOTOS=[["01","O vale"],["02","Eira do Serrado"],["03","A aldeia"],["04","Nevoeiro"],["05","Castanheiros"],
  ["06","Entre montanhas"],["07","O caminho"],["08","Ao entardecer"],["09","As gentes"]];
const mos=document.getElementById('mosaic');
FOTOS.forEach(([n,c],i)=>{const f=document.createElement('figure');f.className='tile';f.dataset.i=i;
  f.innerHTML=`<div class="ph">${n}</div><img src="assets/${n}.jpg" alt="${c}" loading="lazy" onerror="this.remove()"><figcaption>${c}</figcaption>`;
  mos.appendChild(f)});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.style.transitionDelay=(e.target.dataset.i%3)*90+'ms';
  e.target.classList.add('in');io.unobserve(e.target)}}),{threshold:.15});
document.querySelectorAll('.tile').forEach(t=>io.observe(t));
const lb=document.getElementById('lb'),li=lb.querySelector('img'),lc=lb.querySelector('p');let cur=0;
const show=i=>{cur=(i+9)%9;li.src=`assets/${FOTOS[cur][0]}.jpg`;lc.textContent=FOTOS[cur][1];lb.classList.add('open')};
mos.onclick=e=>{const t=e.target.closest('.tile');if(t)show(+t.dataset.i)};
lb.querySelector('.x').onclick=()=>lb.classList.remove('open');
lb.querySelector('.prev').onclick=e=>{e.stopPropagation();show(cur-1)};
lb.querySelector('.next').onclick=e=>{e.stopPropagation();show(cur+1)};
lb.onclick=e=>{if(e.target===lb)lb.classList.remove('open')};
addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;if(e.key==='Escape')lb.classList.remove('open');
  if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});
</script>
</body>
</html>
