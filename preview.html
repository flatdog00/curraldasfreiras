<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Curral das Freiras</title>
<meta name="description" content="Curral das Freiras, Madeira — uma porta para o mundo.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400&display=swap" rel="stylesheet">
<style>
/* =========================================================
   IMAGENS (pasta assets/):
   - hero.jpg            → imagem de fundo em ecrã inteiro
   - 01.jpg … 09.jpg     → mosaico (legendas no fim do ficheiro)
   ========================================================= */
:root{--ink:#f4f1ea;--bg:#0c0f0d;--muted:rgba(244,241,234,.6);--spot:170px}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;font-weight:300;overflow-x:hidden}
@media (hover:hover){body{cursor:none}}

/* ---------- HERO ---------- */
.hero{position:relative;height:100svh;min-height:520px;overflow:hidden;
  background:radial-gradient(ellipse at 30% 20%,#2c3a33 0%,#0f1513 60%,#070908 100%)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;
  animation:breathe 32s ease-in-out infinite alternate}
@keyframes breathe{from{transform:scale(1.02)}to{transform:scale(1.10)}}
.veil{position:absolute;inset:0;background:rgba(8,10,9,.55);
  -webkit-backdrop-filter:grayscale(.9) blur(1.5px);backdrop-filter:grayscale(.9) blur(1.5px);
  -webkit-mask-image:radial-gradient(circle at var(--x,50%) var(--y,50%),transparent 0,transparent calc(var(--spot)*.55),#000 var(--spot));
          mask-image:radial-gradient(circle at var(--x,50%) var(--y,50%),transparent 0,transparent calc(var(--spot)*.55),#000 var(--spot))}
.hero-text{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;padding:0 16px;pointer-events:none}
.hero h1{font-family:"Outfit",sans-serif;font-weight:200;
  font-weight:100;font-size:clamp(2.8rem,9.5vw,8rem);letter-spacing:-.02em;line-height:.95;
  text-shadow:0 4px 40px rgba(0,0,0,.35);animation:rise 1.8s .2s cubic-bezier(.2,.7,.2,1) both}
.hero p{margin-top:22px;font-family:"Outfit",sans-serif;font-weight:200;
  font-size:clamp(.95rem,1.6vw,1.2rem);letter-spacing:.18em;text-transform:lowercase;opacity:.85;animation:rise 1.8s .6s cubic-bezier(.2,.7,.2,1) both}
.corner{position:absolute;font-size:.66rem;letter-spacing:.38em;text-transform:uppercase;opacity:.7}
.corner.bl{left:32px;bottom:28px}.corner.br{right:32px;bottom:28px;opacity:.5}
.scroll{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);width:1px;height:48px;
  background:linear-gradient(var(--ink),transparent);opacity:.6;animation:drip 2.4s ease-in-out infinite}
@keyframes drip{0%{transform:translateX(-50%) scaleY(0);transform-origin:top}
  50%{transform:translateX(-50%) scaleY(1);transform-origin:top}
  51%{transform-origin:bottom}100%{transform:translateX(-50%) scaleY(0);transform-origin:bottom}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* ---------- MOSAICO ---------- */
.intro{max-width:720px;margin:0 auto;padding:clamp(72px,12vw,140px) 16px clamp(40px,6vw,64px);text-align:center}
.intro h2{font-family:"Outfit",sans-serif;font-weight:200;font-size:clamp(1.6rem,3.4vw,2.6rem);line-height:1.25}
.intro small{display:block;margin-top:18px;font-size:.68rem;letter-spacing:.38em;text-transform:uppercase;color:var(--muted)}

.mosaic{display:grid;gap:6px;padding:0 clamp(12px,4vw,64px) clamp(72px,10vw,120px);
  grid-template-columns:repeat(4,1fr);grid-auto-rows:clamp(180px,22vw,320px)}
.tile{position:relative;overflow:hidden;background:#151a17;cursor:none;
  opacity:0;transform:translateY(30px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.2,1)}
.tile.in{opacity:1;transform:none}
.tile img{width:100%;height:100%;object-fit:cover;display:block;
  transition:transform 1.2s cubic-bezier(.2,.7,.2,1),filter .6s ease}
.tile .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:"Outfit",sans-serif;font-weight:200;font-size:2.4rem;opacity:.25;
  background:linear-gradient(135deg,#1c2420,#0f1412)}
.tile figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 20px 18px;
  background:linear-gradient(transparent,rgba(0,0,0,.65));
  font-family:"Outfit",sans-serif;font-weight:200;font-size:1.2rem;
  transform:translateY(100%);transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.tile figcaption span{display:block;font-family:"Outfit",sans-serif;font-style:normal;font-weight:300;
  font-size:.62rem;letter-spacing:.32em;text-transform:uppercase;opacity:.7;margin-bottom:4px}
.mosaic:hover .tile.in:not(:hover){opacity:.45}
.tile:hover img{transform:scale(1.07)}
.tile:hover figcaption{transform:none}

/* layout: 4 colunas, 3 linhas, 9 imagens */
.t2{grid-row:span 2}          /* alta  */
.t6,.t8{grid-column:span 2}   /* larga */

@media (max-width:760px){
  .mosaic{grid-template-columns:repeat(2,1fr);grid-auto-rows:42vw}
  .t2{grid-row:span 2}.t6,.t8{grid-column:span 2}
  .tile figcaption{transform:none}
  .corner.bl{left:16px;bottom:20px}.corner.br{right:16px;bottom:20px}
}

/* ---------- LIGHTBOX ---------- */
.lb{position:fixed;inset:0;z-index:20;background:rgba(6,8,7,.94);display:flex;
  align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .5s}
.lb.open{opacity:1;pointer-events:auto}
.lb img{max-width:90vw;max-height:82vh;object-fit:contain;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.lb p{position:absolute;bottom:28px;left:0;right:0;text-align:center;
  font-family:"Outfit",sans-serif;font-weight:200;font-size:1.3rem}
.lb button{position:absolute;background:none;border:0;color:var(--ink);font-size:2rem;
  opacity:.6;padding:16px;cursor:pointer;font-family:"Outfit",sans-serif;font-weight:100}
.lb button:hover{opacity:1}
.lb .x{top:12px;right:16px}.lb .prev{left:8px}.lb .next{right:8px}

footer{padding:28px 16px 36px;text-align:center;font-size:.62rem;letter-spacing:.35em;
  text-transform:uppercase;color:var(--muted)}

/* ---------- CURSOR ---------- */
.dot,.ring{position:fixed;left:0;top:0;border-radius:50%;pointer-events:none;z-index:30}
.dot{width:6px;height:6px;margin:-3px 0 0 -3px;background:var(--ink)}
.ring{width:38px;height:38px;margin:-19px 0 0 -19px;border:1px solid rgba(244,241,234,.55);
  transition:width .35s,height .35s,margin .35s,background .35s}
.ring.big{width:84px;height:84px;margin:-42px 0 0 -42px;background:rgba(244,241,234,.08)}
@media (hover:none){.dot,.ring{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section class="hero" id="hero">
  <img src="assets/hero.jpg" alt="Curral das Freiras" onerror="this.remove()">
  <div class="veil"></div>
  <div class="hero-text">
    <h1>Curral das Freiras</h1>
    <p>uma porta para o mundo</p>
  </div>
  <div class="corner bl">Em breve</div>
  <div class="corner br">Madeira · Portugal</div>
  <div class="scroll"></div>
</section>

<section class="intro">
  <h2>Um vale escondido entre montanhas, no coração da Madeira.</h2>
  <small>Descobre</small>
</section>

<section class="mosaic" id="mosaic"></section>

<footer>Curral das Freiras · Madeira</footer>

<div class="lb" id="lb">
  <button class="x" aria-label="Fechar">✕</button>
  <button class="prev" aria-label="Anterior">‹</button>
  <img alt="">
  <button class="next" aria-label="Seguinte">›</button>
  <p></p>
</div>

<div class="dot" id="dot"></div>
<div class="ring" id="ring"></div>

<script>
/* ===== LEGENDAS DO MOSAICO (edita à vontade) ===== */
const FOTOS = [
  ["01","O vale"],
  ["02","Eira do Serrado"],
  ["03","A aldeia"],
  ["04","Nevoeiro"],
  ["05","Castanheiros"],
  ["06","Entre montanhas"],
  ["07","O caminho"],
  ["08","Ao entardecer"],
  ["09","As gentes"],
];
/* ================================================= */

const mosaic = document.getElementById('mosaic');
FOTOS.forEach(([n,cap],i)=>{
  const f = document.createElement('figure');
  f.className = `tile t${i+1}`;
  f.dataset.i = i;
  f.innerHTML = `<div class="ph">${n}</div>
    <img src="assets/${n}.jpg" alt="${cap}" loading="lazy" onerror="this.remove()">
    <figcaption><span>${n}</span>${cap}</figcaption>`;
  mosaic.appendChild(f);
});

// entrada ao fazer scroll
const io = new IntersectionObserver(es=>es.forEach(e=>{
  if(e.isIntersecting){e.target.style.transitionDelay=(e.target.dataset.i%4)*90+'ms';
    e.target.classList.add('in');io.unobserve(e.target)}
}),{threshold:.15});
document.querySelectorAll('.tile').forEach(t=>io.observe(t));

// lightbox
const lb=document.getElementById('lb'),lbImg=lb.querySelector('img'),lbCap=lb.querySelector('p');
let cur=0;
function show(i){cur=(i+FOTOS.length)%FOTOS.length;const[n,c]=FOTOS[cur];
  lbImg.src=`assets/${n}.jpg`;lbCap.textContent=c;lb.classList.add('open')}
mosaic.addEventListener('click',e=>{const t=e.target.closest('.tile');if(t)show(+t.dataset.i)});
lb.querySelector('.x').onclick=()=>lb.classList.remove('open');
lb.querySelector('.prev').onclick=e=>{e.stopPropagation();show(cur-1)};
lb.querySelector('.next').onclick=e=>{e.stopPropagation();show(cur+1)};
lb.onclick=e=>{if(e.target===lb)lb.classList.remove('open')};
addEventListener('keydown',e=>{if(!lb.classList.contains('open'))return;
  if(e.key==='Escape')lb.classList.remove('open');
  if(e.key==='ArrowLeft')show(cur-1);if(e.key==='ArrowRight')show(cur+1)});

// cursor + lanterna no hero
const root=document.documentElement,hero=document.getElementById('hero'),
      dot=document.getElementById('dot'),ring=document.getElementById('ring');
let tx=innerWidth/2,ty=innerHeight/2,rx=tx,ry=ty,sx=tx,sy=ty,last=0,t0=performance.now();
addEventListener('pointermove',e=>{tx=e.clientX;ty=e.clientY;last=performance.now()});
document.addEventListener('mouseover',e=>ring.classList.toggle('big',!!e.target.closest('.tile')));
function loop(now){
  const r=hero.getBoundingClientRect();
  let hx=tx-r.left,hy=ty-r.top;
  if(now-last>3000||ty>r.bottom){const t=(now-t0)/1000;
    hx=r.width*(.5+.28*Math.sin(t*.23));hy=r.height*(.5+.2*Math.sin(t*.31+1))}
  sx+=(hx-sx)*.08;sy+=(hy-sy)*.08;
  root.style.setProperty('--x',sx+'px');root.style.setProperty('--y',sy+'px');
  rx+=(tx-rx)*.2;ry+=(ty-ry)*.2;
  dot.style.transform=`translate(${tx}px,${ty}px)`;ring.style.transform=`translate(${rx}px,${ry}px)`;
  requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
