<style>
:root{--ink:#f4f1ea;--bg:#0b0d0c;--muted:rgba(244,241,234,.6)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"Outfit",system-ui,sans-serif;font-weight:300;overflow-x:hidden}

/* ---------- VIAGEM PANORÂMICA (scroll) ---------- */
.stage{position:relative;height:100svh}
.sticky{position:sticky;top:0;height:100svh;overflow:hidden;background:#0b0d0c}
.pano{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform;
  opacity:0;transition:opacity 1.6s ease;user-select:none;pointer-events:none}
.pano.ready{opacity:1}
.shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(8,10,9,.35) 0%,rgba(8,10,9,0) 35%,rgba(8,10,9,0) 60%,rgba(8,10,9,.55) 100%)}
.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding-top:16vh;text-align:center;pointer-events:none;padding-left:16px;padding-right:16px}
.title h1{font-weight:200;font-size:clamp(2rem,5.6vw,5.2rem);letter-spacing:-.02em;line-height:.95;
  text-shadow:0 4px 40px rgba(0,0,0,.35);animation:rise 1.8s .2s cubic-bezier(.2,.7,.2,1) both}
.title .mark{width:clamp(70px,8vw,110px);height:auto;margin-bottom:22px;opacity:.95;animation:rise 1.8s cubic-bezier(.2,.7,.2,1) both}
.title h1 span{opacity:.55}
.title p{margin-top:18px;font-weight:200;font-size:clamp(.85rem,1.4vw,1.05rem);letter-spacing:.24em;opacity:.9;
  animation:rise 1.8s .6s cubic-bezier(.2,.7,.2,1) both}
.cap{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);text-align:center;pointer-events:none;
  font-weight:200;font-size:clamp(1rem,1.8vw,1.35rem);opacity:0;transition:opacity .6s}
.cap small{display:block;font-size:.6rem;letter-spacing:.36em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.meta{position:absolute;left:32px;right:32px;bottom:26px;display:flex;justify-content:space-between;
  font-size:.62rem;letter-spacing:.36em;text-transform:uppercase;color:var(--muted);pointer-events:none}
.bar{position:absolute;left:32px;right:32px;bottom:56px;height:1px;background:rgba(244,241,234,.15);pointer-events:none}
.bar i{display:block;height:100%;width:0;background:var(--ink);opacity:.7}
.hint{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);width:1px;height:42px;
  background:linear-gradient(var(--ink),transparent);opacity:.55;animation:drip 2.4s ease-in-out infinite}
@keyframes drip{0%{transform:translateX(-50%) scaleY(0);transform-origin:top}50%{transform:translateX(-50%) scaleY(1);transform-origin:top}
  51%{transform-origin:bottom}100%{transform:translateX(-50%) scaleY(0);transform-origin:bottom}}
@keyframes rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

/* ---------- MOSAICO (pequeno) ---------- */
.gal{padding:clamp(64px,10vw,120px) clamp(12px,4vw,64px) clamp(64px,8vw,110px)}
.gal h2{font-weight:200;font-size:clamp(1.3rem,2.6vw,1.9rem);text-align:center;margin-bottom:8px}
.gal small{display:block;text-align:center;font-size:.62rem;letter-spacing:.36em;text-transform:uppercase;color:var(--muted);margin-bottom:40px}
.mosaic{display:grid;gap:2px;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(2,clamp(170px,19vw,320px));
  grid-template-areas:"a b c d d" "e b f g h"}
.tile:nth-child(1){grid-area:a}.tile:nth-child(2){grid-area:b}.tile:nth-child(3){grid-area:c}
.tile:nth-child(4){grid-area:d}.tile:nth-child(5){grid-area:e}.tile:nth-child(6){grid-area:f}
.tile:nth-child(7){grid-area:g}.tile:nth-child(8){grid-area:h}
.tile{position:relative;overflow:hidden;background:#141816;cursor:pointer;
  opacity:0;transform:translateY(24px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1)}
.tile.in{opacity:1;transform:none}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.1s cubic-bezier(.2,.7,.2,1)}
.tile .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:100;font-size:2rem;opacity:.25}
.tile figcaption{position:absolute;left:0;right:0;bottom:0;padding:18px 14px 12px;font-weight:200;font-size:.95rem;
  background:linear-gradient(transparent,rgba(0,0,0,.6));transform:translateY(100%);transition:transform .5s cubic-bezier(.2,.7,.2,1)}
.mosaic:hover .tile.in:not(:hover){opacity:.45}
.tile:hover img{transform:scale(1.07)}.tile:hover figcaption{transform:none}
@media (max-width:640px){.mosaic{grid-template-columns:repeat(2,1fr);grid-template-rows:none;grid-auto-rows:46vw;
    grid-template-areas:"a b" "c b" "d d" "e f" "g h"}.tile figcaption{transform:none}
  .meta,.bar{left:16px;right:16px}}

.lb{position:fixed;inset:0;z-index:20;background:rgba(6,8,7,.95);display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .4s}
.lb.open{opacity:1;pointer-events:auto}
.lb img{max-width:90vw;max-height:82vh;object-fit:contain}
.lb p{position:absolute;bottom:26px;left:0;right:0;text-align:center;font-weight:200}
.lb button{position:absolute;background:none;border:0;color:var(--ink);font:100 2rem "Outfit";opacity:.6;padding:16px;cursor:pointer}
.lb button:hover{opacity:1}.lb .x{top:10px;right:14px}.lb .prev{left:6px}.lb .next{right:6px}

footer{padding:24px 16px 34px;text-align:center;font-size:.58rem;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}

/* ---------- NÉVOA (imersivo) ---------- */
.fog{position:absolute;inset:-20%;pointer-events:none;mix-blend-mode:screen;opacity:.55}
.fog i{position:absolute;border-radius:50%;filter:blur(60px);background:radial-gradient(closest-side,rgba(235,240,238,.35),rgba(235,240,238,0))}
.fog i:nth-child(1){width:70vw;height:28vh;left:5%;top:52%;animation:drift1 46s ease-in-out infinite alternate}
.fog i:nth-child(2){width:60vw;height:22vh;left:40%;top:62%;animation:drift2 58s ease-in-out infinite alternate}
.fog i:nth-child(3){width:50vw;height:18vh;left:20%;top:70%;opacity:.7;animation:drift1 70s ease-in-out infinite alternate-reverse}
@keyframes drift1{from{transform:translateX(-12vw)}to{transform:translateX(14vw)}}
@keyframes drift2{from{transform:translateX(10vw)}to{transform:translateX(-16vw)}}

/* ---------- CONTAGEM REGRESSIVA ---------- */
.count{position:absolute;left:0;right:0;bottom:clamp(74px,12vh,120px);display:flex;flex-direction:column;align-items:center;
  pointer-events:none;animation:rise 2s 1s cubic-bezier(.2,.7,.2,1) both}
.count .lead{font-size:.62rem;letter-spacing:.42em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
.units{display:flex;align-items:flex-start;gap:clamp(8px,1.6vw,22px)}
.u{display:flex;flex-direction:column;align-items:center;min-width:clamp(50px,6.4vw,96px)}
.u b{font-weight:300;font-size:clamp(2rem,4.6vw,4rem);line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;
  display:inline-block;text-shadow:0 4px 40px rgba(0,0,0,.4)}
.u b.tick{animation:tick .7s cubic-bezier(.2,.7,.2,1)}
@keyframes tick{0%{opacity:.15;filter:blur(6px);transform:translateY(-10px)}100%{opacity:1;filter:none;transform:none}}
.u small{margin-top:10px;font-size:.58rem;letter-spacing:.36em;text-transform:uppercase;color:var(--muted)}
.sep{font-weight:200;font-size:clamp(1.6rem,3.2vw,2.8rem);line-height:1.15;opacity:.3}
.count .date{margin-top:16px;font-size:.62rem;letter-spacing:.42em;color:var(--muted)}
.count.done .units{display:none}
.stock{position:absolute;left:32px;bottom:72px;display:flex;flex-direction:column;align-items:flex-start;gap:14px;
  pointer-events:auto;z-index:4;animation:rise 2s 1.3s cubic-bezier(.2,.7,.2,1) both}
.stock[hidden]{display:none}
.stock-lead{font-size:.56rem;letter-spacing:.42em;text-transform:uppercase;color:var(--muted)}
.stock-row{display:flex;flex-direction:column;gap:9px}
.si{display:flex;align-items:baseline;gap:18px;color:var(--ink);text-decoration:none;opacity:.88;transition:opacity .3s}
a.si:hover{opacity:1}
.si .sn{min-width:11.5em;font-size:.66rem;letter-spacing:.2em;color:var(--muted)}
.si .sc{font-size:.78rem;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.si.out .sc{color:var(--muted)}
@media (max-width:980px){
  .stock{left:16px;right:16px;bottom:64px;align-items:center;gap:8px}
  .stock-row{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:16px}
  .si{flex-direction:column;align-items:center;gap:3px}
  .si .sn{min-width:0;font-size:.56rem}
  .count{bottom:clamp(128px,17vh,160px)}}
.count .brand{margin-top:26px;width:clamp(150px,13vw,200px);height:auto;opacity:.75}
.social{margin-top:18px;display:flex;gap:18px;justify-content:center;pointer-events:auto}
.social a{display:block;opacity:.55;transition:opacity .3s}
.social a:hover{opacity:1}
.social svg{width:15px;height:15px;fill:#fff;display:block}
@media (max-width:640px){.sep{display:none}.units{gap:4px}.u{min-width:21vw}.u b{font-size:2rem}.u small{font-size:.5rem;letter-spacing:.22em}.meta{font-size:.52rem;letter-spacing:.24em}}
@media (prefers-reduced-motion:reduce){.fog i{animation:none}.u b.tick{animation:none}}
/* ---------- IDIOMAS ---------- */
.lang{position:absolute;top:26px;right:32px;display:flex;gap:14px;font-size:.62rem;letter-spacing:.28em;pointer-events:auto;z-index:5}
.lang a{color:var(--muted);text-decoration:none;opacity:.7;transition:opacity .3s,color .3s;letter-spacing:.2em}
.lang a:hover{opacity:1;color:var(--ink)}
.lang a.on{opacity:1;color:var(--ink)}
.lang a[lang=zh],.lang a[lang=ar]{letter-spacing:0;font-size:.72rem}
html[lang=zh] .title p,html[lang=ar] .title p{letter-spacing:.08em;font-size:clamp(.95rem,1.5vw,1.15rem)}
html[lang=zh] .lead,html[lang=ar] .lead,html[lang=zh] .u small,html[lang=ar] .u small{letter-spacing:.12em}
html[lang=zh] .u small,html[lang=ar] .u small,html[lang=zh] .lead,html[lang=ar] .lead{font-size:.72rem}
html[lang=zh] body{font-family:"Outfit","Noto Sans SC",system-ui,sans-serif}
html[lang=ar] body{font-family:"Outfit","Noto Sans Arabic",system-ui,sans-serif}
@media (max-width:640px){.lang{top:18px;right:16px;gap:11px;font-size:.56rem}}
body.pmode .ptx{color:transparent!important;text-shadow:none!important}
#pt{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
</style>

<script>
/* ===== VIAGEM: pontos da panorâmica (0–1) =====

const KEYS = [
  {x:.30, y:.50, z:1.00},   // início: vista larga, lado esquerdo
  {x:.55, y:.55, z:1.25},   // percorre o vale
  {x:.555,y:.64, z:2.40},   // mergulha na aldeia
];
const MOB={x:.448,y:.652,z:1.69};   // telemóvel: casas da encosta
const IS_MOB=matchMedia('(max-width:760px),(hover:none)').matches;
/* ============================================= */

const pano=document.getElementById('pano'),sticky=document.getElementById('sticky'),stage=document.getElementById('stage');
const title=document.getElementById('title'),cap=document.getElementById('cap');
let prog=0,sp=0,mx=0,my=0,smx=0,smy=0,W,H,IW,IH;

function size(){W=sticky.clientWidth;H=sticky.clientHeight;
  const ar=pano.naturalWidth/pano.naturalHeight||3;
  IH=Math.max(H,W/ar*1.0);IW=IH*ar;               // a imagem cobre sempre o ecrã
  pano.style.width=IW+'px';pano.style.height=IH+'px'}
function ready(){size();pano.classList.add('ready')}
pano.complete?ready():pano.addEventListener('load',ready);
addEventListener('resize',size);

/* imagem fixa: sem animação ao scroll nem ao rato */
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const lerp=(a,b,t)=>a+(b-a)*t;

function frame(){
  sp+=(prog-sp)*.075; smx+=(mx-smx)*.05; smy+=(my-smy)*.05;
  // posição entre os pontos-chave
  const seg=sp*(KEYS.length-1), i=Math.min(KEYS.length-2,Math.floor(seg)), t=ease(seg-i);
  let A=KEYS[i],B=KEYS[i+1];
  if(W<760){A=B=MOB}
  const z=lerp(A.z,B.z,t), cx=lerp(A.x,B.x,t), cy=lerp(A.y,B.y,t);
  if(IW){
    const s=z, w=IW*s, h=IH*s;
    // parallax do rato: ligeiro desvio, mais forte com mais zoom
    let tx=W/2-cx*w - smx*40*s, ty=H/2-cy*h - smy*24*s;
    tx=Math.min(0,Math.max(W-w,tx)); ty=Math.min(0,Math.max(H-h,ty));   // nunca mostrar bordas
    pano.style.transform=`translate3d(${tx}px,${ty}px,0) scale(${s})`;
  }
  title.style.opacity=Math.max(0,1-sp*2.4); title.style.transform=`translateY(${-sp*80}px)`;
  
  cap.style.opacity=sp>.8?Math.min(1,(sp-.8)*6):0;
  
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);



/* ===== TESTE DE EFEITOS DO RATO (WebGL) ===== */
(function(){
  if(IS_MOB)return;
  const cv=document.getElementById('gl'),gl=cv.getContext('webgl2',{premultipliedAlpha:false});
  if(!gl)return;
  const img=document.getElementById('pano');
  const VS=`#version 300 es
in vec2 a;void main(){gl_Position=vec4(a,0,1);}`;
  const FS=`#version 300 es
precision highp float;
uniform sampler2D I,T;uniform vec2 R,M;uniform vec4 Q;uniform int md;uniform float tm,act;
out vec4 o;
vec2 uvOf(vec2 p){return (p-Q.xy)/Q.zw;}

void main(){
  vec2 p=vec2(gl_FragCoord.x,R.y-gl_FragCoord.y);

    vec2 d=g*120.+g*sin(v*18.-tm*3.)*40.;

    float v=tr(p);
    vec2 d=g*90.+g*sin(v*14.-tm*2.4)*30.;
    c=texture(I,uvOf(p-d)).rgb;
    c+=vec3(.85,.92,1.)*length(g)*.18;
  }else{
    c=texture(I,uvOf(p)).rgb;
    vec3 b=textureLod(I,uvOf(p),5.5).rgb;

    float N=22.,f=fract(h*N),w=fwidth(h*N);
    float line=1.-smoothstep(0.,w*1.4,min(f,1.-f));
    float m=tr(p);
    c=mix(c,c*.82,m*.5)+vec3(1.,.97,.9)*line*m*.75;

}`;
  function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(x));return x}
  const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
  const b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  const al=gl.getAttribLocation(pr,'a');gl.enableVertexAttribArray(al);gl.vertexAttribPointer(al,2,gl.FLOAT,false,0,0);
  const U=n=>gl.getUniformLocation(pr,n);
  const ti=gl.createTexture(),tt=gl.createTexture();
  // rasto do rato
  const tc=document.createElement('canvas'),tx=tc.getContext('2d');
  let mxp=-1,myp=-1,lx=-1,ly=-1,act=0,sa=0,mode=3,ok=false,DPR=Math.min(devicePixelRatio,2);
  function rs(){cv.width=cv.clientWidth*DPR;cv.height=cv.clientHeight*DPR;tc.width=Math.ceil(cv.clientWidth/4);tc.height=Math.ceil(cv.clientHeight/4);tx.fillStyle='#000';tx.fillRect(0,0,tc.width,tc.height)}
  rs();addEventListener('resize',rs);
  function load(){
    gl.bindTexture(gl.TEXTURE_2D,ti);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,img);gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR_MIPMAP_LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    gl.bindTexture(gl.TEXTURE_2D,tt);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
    ok=true;img.style.visibility='hidden';
  }
  const L=()=>{try{load()}catch(e){console.warn(e)}};img.complete&&img.naturalWidth?L():img.addEventListener("load",L);
  addEventListener('pointermove',e=>{const r=cv.getBoundingClientRect();mxp=e.clientX-r.left;myp=e.clientY-r.top;act=1},{passive:true});
  document.addEventListener('pointerleave',()=>{act=0;lx=-1});
  if(0)document.querySelectorAll('#fx button').forEach(bt=>bt.addEventListener('click',()=>{mode=+bt.dataset.m;window.FXMODE=mode;document.querySelectorAll('#fx button').forEach(x=>x.classList.toggle('on',x===bt));tx.fillStyle='#000';tx.fillRect(0,0,tc.width,tc.height)}));
  function loop(ts){
    requestAnimationFrame(loop);if(!ok)return;
    // rasto: desvanece e pinta o caminho do rato
    tx.globalCompositeOperation='source-over';tx.fillStyle=mode==2?'rgba(0,0,0,.025)':mode==3?'rgba(0,0,0,.022)':'rgba(0,0,0,.05)';tx.fillRect(0,0,tc.width,tc.height);
    if(act&&mxp>=0){const X=mxp/4,Y=myp/4,Rr=mode==2?tc.height*.16:mode==3?tc.height*.05:tc.height*.07;if(lx<0){lx=X;ly=Y}
      const dist=Math.hypot(X-lx,Y-ly),n=Math.max(1,Math.ceil(dist/(Rr*.3)));tx.globalCompositeOperation='lighter';
      for(let k=1;k<=n;k++){const x=lx+(X-lx)*k/n,y=ly+(Y-ly)*k/n,g=tx.createRadialGradient(x,y,0,x,y,Rr);g.addColorStop(0,`rgba(255,255,255,${mode==2?.12:mode==3?.16*Math.min(1,dist/4):.22*Math.min(1,dist/6+.15)})`);g.addColorStop(1,'rgba(255,255,255,0)');tx.fillStyle=g;tx.fillRect(x-Rr,y-Rr,Rr*2,Rr*2)}
      lx=X;ly=Y}

    gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,ti);
    const r=img.getBoundingClientRect(),c=cv.getBoundingClientRect();
    sa+=(act-sa)*.08;
    gl.viewport(0,0,cv.width,cv.height);
    gl.uniform1i(U('I'),0);gl.uniform1i(U('T'),1);
    gl.uniform2f(U('R'),cv.width,cv.height);gl.uniform2f(U('M'),mxp*DPR,myp*DPR);

    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }
  requestAnimationFrame(loop);
})();


/* ===== D · TEXTO FEITO DE PARTÍCULAS (afasta-se com o rato e volta) ===== */
window.FXMODE=3;
(function(){
  if(IS_MOB)return;
  const cv=document.getElementById('pt'),x=cv.getContext('2d'),DPR=Math.min(devicePixelRatio,2);
  const els=[document.querySelector('.title h1'),document.querySelector('.title p'),...document.querySelectorAll('.u b')];
  els.forEach(e=>e.classList.add('ptx'));
  const G=els.map(e=>({e,txt:'',P:[],k:e.tagName==='B'?.09:.022}));
  const off=document.createElement('canvas'),ox=off.getContext('2d',{willReadFrequently:true});
  function sample(e){
    const r=e.getBoundingClientRect(),cs=getComputedStyle(e),fs=parseFloat(cs.fontSize);
    const S=2,W=Math.ceil(r.width+60)*S,H=Math.ceil(r.height+30)*S;off.width=W;off.height=H;
    ox.setTransform(S,0,0,S,0,0);ox.clearRect(0,0,W,H);ox.fillStyle='#fff';ox.font=`${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
    try{ox.letterSpacing=cs.letterSpacing}catch(_){}
    ox.textAlign='center';ox.textBaseline='middle';
    const ls=parseFloat(cs.letterSpacing)||0;ox.fillText(e.textContent,W/S/2+ls/2,H/S/2+fs*.05);
    const d=ox.getImageData(0,0,W,H).data,pts=[],st=innerWidth<700?3:2;
    for(let y=0;y<H;y+=st)for(let xx=0;xx<W;xx+=st){const a=d[(y*W+xx)*4+3];if(a>40)pts.push([xx/S-W/S/2+(Math.random()-.5)*.6,y/S-H/S/2+(Math.random()-.5)*.6,a/255])}
    for(let i=pts.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[pts[i],pts[j]]=[pts[j],pts[i]]}
    return {pts,size:fs>40?1.05:.85};
  }
  function rebuild(g,first){
    const {pts,size}=sample(g.e);const old=g.P,r=g.e.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    g.P=pts.map((p,i)=>{const o=old.length?old[i%old.length]:null;
      return {hx:p[0],hy:p[1],a:p[2],s:size*(.8+Math.random()*.5),x:o?o.x:cx+p[0]+(first?(Math.random()-.5)*300:0),y:o?o.y:cy+p[1]+(first?(Math.random()-.5)*120:0),vx:o?o.vx:0,vy:o?o.vy:0,ph:Math.random()*6.28}});
    g.txt=g.e.textContent;
  }
  function rs(){cv.width=cv.clientWidth*DPR;cv.height=cv.clientHeight*DPR;G.forEach(g=>g.txt='')}
  rs();addEventListener('resize',rs);
  let ready=false;(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>setTimeout(()=>{G.forEach(g=>rebuild(g,true));ready=true},250));
  let mx=-9999,my=-9999,vx=0,vy=0,lx=null,ly=null;
  addEventListener('pointermove',e=>{if(lx!==null){vx=vx*.5+(e.clientX-lx)*.5;vy=vy*.5+(e.clientY-ly)*.5}lx=mx=e.clientX;ly=my=e.clientY},{passive:true});
  document.addEventListener('pointerleave',()=>{mx=my=-9999;lx=null});
  let t0=performance.now();
  function loop(now){
    requestAnimationFrame(loop);
    const on=window.FXMODE===3;document.body.classList.toggle('pmode',on&&ready);
    const cr=cv.getBoundingClientRect();x.setTransform(DPR,0,0,DPR,-cr.left*DPR,-cr.top*DPR);x.clearRect(cr.left,cr.top,cr.width,cr.height);
    if(!on||!ready)return;
    const tt=(now-t0)/1000,spd=Math.min(40,Math.hypot(vx,vy));
    x.globalCompositeOperation='lighter';x.lineCap='round';
    for(const g of G){
      if(g.e.textContent!==g.txt)rebuild(g,false);
      const r=g.e.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,al=+getComputedStyle(g.e.parentElement).opacity||1;
      const R=Math.max(70,r.height*1.3)*(1+spd/40);
      for(const p of g.P){
        const hx=cx+p.hx,hy=cy+p.hy;
        const dx=p.x-mx,dy=p.y-my,d2=dx*dx+dy*dy;
        if(d2<R*R){const d=Math.sqrt(d2)+.01,f=Math.pow(1-d/R,2);
          p.vx+=(dx/d)*f*(.7+spd*.05)+vx*f*.12+(-dy/d)*f*spd*.02;
          p.vy+=(dy/d)*f*(.7+spd*.05)+vy*f*.12+(dx/d)*f*spd*.02;}
        // ondas lentas de "névoa" enquanto está fora do sítio
        const ox=p.x-hx,oy=p.y-hy,od=Math.abs(ox)+Math.abs(oy);
        if(od>6){const w=Math.min(1,od/60)*.06;p.vx+=Math.sin(p.y*.02+tt*1.2+p.ph)*w;p.vy+=Math.cos(p.x*.02+tt*.9+p.ph)*w-.012*Math.min(1,od/60)}
        p.vx+=(hx-p.x)*g.k;p.vy+=(hy-p.y)*g.k;p.vx*=.88;p.vy*=.88;const vm=Math.hypot(p.vx,p.vy);if(vm>7){p.vx*=7/vm;p.vy*=7/vm}
        const px=p.x,py=p.y;p.x+=p.vx;p.y+=p.vy;
        const sp=Math.abs(p.vx)+Math.abs(p.vy),fly=Math.min(1,od/40);
        const a=p.a*al*(.85+.15*Math.sin(tt*2+p.ph))*(1-fly*.25);
        if(sp>2.5&&fly>.15){x.strokeStyle=`rgba(244,241,234,${a*.45})`;x.lineWidth=p.s*.9;x.beginPath();x.moveTo(p.x-p.vx*1.1,p.y-p.vy*1.1);x.lineTo(p.x,p.y);x.stroke()}
        else{x.fillStyle=`rgba(244,241,234,${a})`;x.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s)}
      }
    }

  }
  requestAnimationFrame(loop);
})();

  document.documentElement.lang=l;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=L[e.dataset.i]);
  const lead=document.getElementById('lead');lead.textContent=document.getElementById('count').classList.contains('done')?L.done:L.lead;
  document.querySelectorAll('#lang a').forEach(a=>a.classList.toggle('on',a.lang===l));
  if(FONTS[l]&&!document.getElementById('f-'+l)){const k=document.createElement('link');k.id='f-'+l;k.rel='stylesheet';k.href='https://fonts.googleapis.com/css2?family='+FONTS[l]+'&display=swap';document.head.appendChild(k)}
  try{localStorage.setItem('lang',l)}catch(e){}
  if(window.renderStock)renderStock();
  if(push)history.replaceState(null,'',l==='pt'?location.pathname:'?lang='+l);
}
document.querySelectorAll('#lang a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();setLang(a.lang,true)}));
(function(){
  const q=new URLSearchParams(location.search).get('lang');
  let s=null;try{s=localStorage.getItem('lang')}catch(e){}
  const n=(navigator.language||'pt').slice(0,2).toLowerCase();
  setLang(q||s||(I18N[n]?n:'pt'),false);
})();

/* ===== CONTAGEM REGRESSIVA: 5 fev 2028, 00:00 (hora da Madeira = UTC+0 em fevereiro) ===== */
(function(){
  const T=Date.UTC(2028,1,5,0,0,0);
  const el={d:document.getElementById('cd-d'),h:document.getElementById('cd-h'),m:document.getElementById('cd-m'),s:document.getElementById('cd-s')};
  const box=document.getElementById('count'),lead=document.getElementById('lead');
  const last={};
  function set(k,v){if(last[k]===v)return;last[k]=v;const e=el[k];e.textContent=v;e.classList.remove('tick');void e.offsetWidth;e.classList.add('tick')}
  function tick(){
    let ms=T-Date.now();
    if(ms<=0){box.classList.add('done');lead.textContent=I18N[LANG].done;return}
    const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sec=s%60;
    set('d',String(d).padStart(3,'0'));set('h',String(h).padStart(2,'0'));set('m',String(m).padStart(2,'0'));set('s',String(sec).padStart(2,'0'));
    setTimeout(tick,1000-Date.now()%1000);
  }
  tick();
})();

/* ===== CONTADOR DA EDIÇÃO FUNDADOR: lê data/stock.json (atualizado pelo GitHub Actions a partir do Patreon) ===== */
(function(){
  const box=document.getElementById('stock'),row=document.getElementById('stock-row');
  let S=null;
  window.renderStock=function(){
    if(!S||!S.tiers||!S.tiers.length)return;
    const L=I18N[LANG],closed=S.close&&Date.now()>=Date.parse(S.close);
    row.textContent='';
    S.tiers.forEach(t=>{
      const full=t.limit&&t.count>=t.limit;
      const el=document.createElement(S.url&&!closed&&!full?'a':'div');
      el.className='si'+(full||closed?' out':'');
      if(el.tagName==='A'){el.href=S.url;el.target='_blank';el.rel='noopener'}
      const n=document.createElement('span');n.className='sn';n.textContent=t.name;
      const c=document.createElement('span');c.className='sc';
      c.textContent=closed?L.closed:full?L.out:(t.limit?t.count+' '+L.of+' '+t.limit:String(t.count));
      el.append(n,c);row.appendChild(el);
    });
    box.hidden=false;
  };
  fetch('data/stock.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(j=>{S=j;renderStock()}).catch(()=>{});
})();
</script>
